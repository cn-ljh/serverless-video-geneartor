AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  S3BucketName:
    Type: String
    Description: Name of the existing S3 bucket
    Default: bedrock.lijinhong.cn
  FrontendBucketName:
    Type: String
    Description: Name of the S3 bucket for frontend hosting
    Default: specialty-builder-frontend


Resources:
  # Frontend S3 Bucket
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref FrontendBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudFrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub "CloudFront OAI for ${FrontendBucketName}"

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              CanonicalUser: !GetAtt CloudFrontOriginAccessIdentity.S3CanonicalUserId
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'

  # CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - DomainName: !Sub ${FrontendBucketName}.s3.${AWS::Region}.amazonaws.com
            Id: S3Origin
            S3OriginConfig:
              OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${CloudFrontOriginAccessIdentity}"
        Enabled: true
        DefaultRootObject: index.html
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  # Lambda Layer
  CommonDependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: common-dependencies
      Description: Common dependencies for Lambda functions
      ContentUri: lambda-layer/
      CompatibleRuntimes:
        - python3.9
      RetentionPolicy: Retain

  # CloudWatch Log Group for API Gateway
  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${RestApi}/prod
      RetentionInDays: 7

  # IAM Role for API Gateway Logging
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  # API Gateway Account Settings
  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  # API Gateway
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: GenAIBuilderApi
      EndpointConfiguration:
        Types:
          - REGIONAL

  ParseResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: parse

  RetryResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: retry

  QueryResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: query

  ReSynthesizerResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: re-syntherizer

  ParsePostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ParseResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:states:action/StartExecution
        Credentials: !GetAtt ApiGatewayStepFunctionsRole.Arn
        RequestTemplates:
          application/json: !Sub |
            {
              "input": "$util.escapeJavaScript($input.json('$'))",
              "stateMachineArn": "$util.escapeJavaScript($stageVariables.arn)"
            }
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  ParseOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ParseResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  RetryPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref RetryResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TaskRetrierFunction.Arn}/invocations
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  RetryOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref RetryResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  QueryPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref QueryResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TaskQueryFunction.Arn}/invocations
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  QueryOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref QueryResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  ReSynthesizerPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ReSynthesizerResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${VideoSynthesizerFunction.Arn}/invocations
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  StatusResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: status

  StatusPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref StatusResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TaskStatusCheckerFunction.Arn}/invocations
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true

  StatusOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref StatusResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  ReSynthesizerOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ReSynthesizerResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: 
      - ParsePostMethod
      - ParseOptionsMethod
      - RetryPostMethod
      - RetryOptionsMethod
      - QueryPostMethod
      - QueryOptionsMethod
      - ReSynthesizerPostMethod
      - ReSynthesizerOptionsMethod
      - StatusPostMethod
      - StatusOptionsMethod
    Properties:
      RestApiId: !Ref RestApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
      Variables:
        arn: !Ref StepFunctionsStateMachine

  # DynamoDB Table - Using taskid as primary key
  GenAIBuilderTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: GenAIBuilderTable
      AttributeDefinitions:
        - AttributeName: taskid
          AttributeType: S
        - AttributeName: sceneid
          AttributeType: S
      KeySchema:
        - AttributeName: taskid
          KeyType: HASH
        - AttributeName: sceneid
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  # Lambda Functions
  InputParserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: input parser/
      Runtime: python3.9
      Timeout: 900
      MemorySize: 128
      Layers:
        - !Ref CommonDependenciesLayer
      Handler: input_parser.lambda_handler
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref GenAIBuilderTable
          S3_BUCKET: !Ref S3BucketName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GenAIBuilderTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:*
              Resource: '*'

  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: create task/
      Runtime: python3.9
      Timeout: 900
      MemorySize: 128
      Layers:
        - !Ref CommonDependenciesLayer
      Handler: create_task.lambda_handler
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref GenAIBuilderTable
          S3_BUCKET: !Ref S3BucketName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GenAIBuilderTable

  ImageGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: image generator/
      Runtime: python3.9
      Timeout: 900
      MemorySize: 128
      Layers:
        - !Ref CommonDependenciesLayer
      Handler: image_generator.lambda_handler
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref GenAIBuilderTable
          S3_BUCKET: !Ref S3BucketName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GenAIBuilderTable
        - S3CrudPolicy:
            BucketName: !Ref S3BucketName
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:*
              Resource: '*'

  SpeechGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: speech generator/
      Runtime: python3.9
      Timeout: 900
      MemorySize: 128
      Layers:
        - !Ref CommonDependenciesLayer
      Handler: speech_generator.lambda_handler
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref GenAIBuilderTable
          S3_BUCKET: !Ref S3BucketName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GenAIBuilderTable
        - S3CrudPolicy:
            BucketName: !Ref S3BucketName
        - Statement:
            - Effect: Allow
              Action:
                - polly:*
              Resource: '*'

  VideoGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: video generator/
      Runtime: python3.9
      Timeout: 900
      MemorySize: 128
      Layers:
        - !Ref CommonDependenciesLayer
      Handler: video_generator_from_s3.lambda_handler
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref GenAIBuilderTable
          S3_BUCKET: !Ref S3BucketName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GenAIBuilderTable
        - S3CrudPolicy:
            BucketName: !Ref S3BucketName
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:*
              Resource: '*'

  TaskStatusCheckerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: task status checker/
      Runtime: python3.9
      Timeout: 900
      MemorySize: 128
      Layers:
        - !Ref CommonDependenciesLayer
      Handler: task_status_checker.lambda_handler
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref GenAIBuilderTable
          S3_BUCKET: !Ref S3BucketName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GenAIBuilderTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:*
                - polly:*
              Resource: '*'

  TaskQueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: task query/
      Runtime: python3.9
      Timeout: 60
      MemorySize: 128
      Layers:
        - !Ref CommonDependenciesLayer
      Handler: task_query.lambda_handler
      Events:
        QueryApi:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /query
            Method: POST
      Environment:
        Variables:
          TASKS_TABLE: !Ref GenAIBuilderTable
          TASK_STATUS_CHECKER_FUNCTION: !Ref TaskStatusCheckerFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt TaskStatusCheckerFunction.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref GenAIBuilderTable

  TaskRetrierFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: task retrier/
      Runtime: python3.9
      Timeout: 60
      MemorySize: 128
      Layers:
        - !Ref CommonDependenciesLayer
      Handler: retry_task.lambda_handler
      Events:
        RetryApi:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /retry
            Method: POST
      Environment:
        Variables:
          IMAGE_GENERATOR_FUNCTION: !GetAtt ImageGeneratorFunction.Arn
          VIDEO_GENERATOR_FUNCTION: !GetAtt VideoGeneratorFunction.Arn
          SPEECH_GENERATOR_FUNCTION: !GetAtt SpeechGeneratorFunction.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt ImageGeneratorFunction.Arn
                - !GetAtt VideoGeneratorFunction.Arn
                - !GetAtt SpeechGeneratorFunction.Arn

  VideoSynthesizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["video_synthesizer.lambda_handler"]
      Timeout: 900
      MemorySize: 1024
      Events:
        ReSynthesizerApi:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /re-syntherizer
            Method: POST
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref GenAIBuilderTable
          S3_BUCKET: !Ref S3BucketName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GenAIBuilderTable
        - S3CrudPolicy:
            BucketName: !Ref S3BucketName
    Metadata:
      DockerTag: latest
      DockerContext: video synthesizer/
      Dockerfile: Dockerfile

  # IAM Role for API Gateway to invoke Step Functions
  ApiGatewayStepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !GetAtt StepFunctionsStateMachine.Arn

  # Step Functions State Machine
  StepFunctionsStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionSubstitutions:
        InputParserFunctionArn: !GetAtt InputParserFunction.Arn
        CreateTaskFunctionArn: !GetAtt CreateTaskFunction.Arn
        ImageGeneratorFunctionArn: !GetAtt ImageGeneratorFunction.Arn
        SpeechGeneratorFunctionArn: !GetAtt SpeechGeneratorFunction.Arn
        VideoGeneratorFunctionArn: !GetAtt VideoGeneratorFunction.Arn
        TaskStatusCheckerFunctionArn: !GetAtt TaskStatusCheckerFunction.Arn
        VideoSynthesizerFunctionArn: !GetAtt VideoSynthesizerFunction.Arn
        TaskRetrierFunctionArn: !GetAtt TaskRetrierFunction.Arn
      DefinitionUri: statemachine/definition.asl.json
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref InputParserFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CreateTaskFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ImageGeneratorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref SpeechGeneratorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref VideoGeneratorFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref TaskStatusCheckerFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref VideoSynthesizerFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref TaskRetrierFunction

Outputs:
  CloudFrontDomainName:
    Description: Domain name of the CloudFront distribution
    Value: !GetAtt CloudFrontDistribution.DomainName

  ApiEndpoints:
    Description: API Gateway endpoint URLs
    Value:
      Fn::Join:
        - "\n"
        - - !Sub https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/parse
          - !Sub https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/retry
          - !Sub https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/query
          - !Sub https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/re-syntherizer
          - !Sub https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/status
  StateMachineArn:
    Description: Step Functions state machine ARN
    Value: !Ref StepFunctionsStateMachine
